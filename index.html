<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG to Base64 Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link type="image/png" sizes="16x16" rel="icon" href="/favicon-16.png">
<link type="image/png" sizes="32x32" rel="icon" href="/favicon-32.png">
<link type="image/png" sizes="96x96" rel="icon" href="/favicon-96.png">
<link type="image/png" sizes="120x120" rel="icon" href="/favicon-120.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      color: #333;
    }

    header {
      background: #222;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 1rem;
      gap: 1rem;
    }

    .column {
      flex: 1 1 100%;
      max-width: 100%;
    }

    @media (min-width: 768px) {
      .column {
        flex: 1 1 45%;
        max-width: 45%;
      }
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.08);
      padding: 1.5rem;
    }

    textarea {
      width: 100%;
      height: 200px;
      margin-top: 0.5rem;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
    }

    .output {
      background: #f1f1f1;
      border: 1px dashed #bbb;
      border-radius: 8px;
      padding: 1rem;
      word-break: break-word;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
    }

    .preview-box {
      width: 100%;
      height: 150px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 1rem;
    }

    .upload-box {
      border: 2px dashed #aaa;
      padding: 2rem;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      background-color: #fafafa;
      transition: background 0.2s ease;
    }

    .upload-box:hover {
      background-color: #f0f0f0;
    }

    .upload-box p {
      margin: 0;
      font-size: 1rem;
      color: #333;
    }

    #fileInput {
      display: none;
    }

    button {
      background: #0066ff;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
    }

    button:hover {
      background: #0050cc;
    }

    .spacer {
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

<header>SVG to Base64 Converter</header>

<div class="container">
  <!-- Left Column -->
  <div class="column">
    <div class="card">
      <!-- Custom File Upload UI -->
      <label for="fileInput">
        <div class="upload-box">
          <p>📁 Click to upload SVG file<br>or drag and drop</p>
        </div>
      </label>
      <input type="file" id="fileInput" accept=".svg">

      <!-- Paste SVG Text -->
      <label class="label spacer">Or Paste SVG Code</label>
      <textarea id="svgTextarea" placeholder="<svg>...</svg>"></textarea>

      <button onclick="convertSVG()">Convert</button>
    </div>
  </div>

  <!-- Right Column -->
  <div class="column">
    <div class="card">
      <label class="label">Base64 Output:</label>
      <div class="output" id="base64Output">Base64 result will appear here...</div>

      <label class="label spacer">CSS Background Snippet:</label>
      <div class="output" id="cssOutput">background-image: url(...);</div>

      <label class="label spacer">Simple CSS SVG (Inline):</label>
      <div class="output" id="simpleOutput">background-image: url(...);</div>

      <div class="preview-box" id="previewBox"></div>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const svgTextarea = document.getElementById('svgTextarea');
  const base64Output = document.getElementById('base64Output');
  const cssOutput = document.getElementById('cssOutput');
  const simpleOutput = document.getElementById('simpleOutput');
  const previewBox = document.getElementById('previewBox');

  fileInput.addEventListener('change', function () {
    const file = this.files[0];
    if (file && file.type === 'image/svg+xml') {
      const reader = new FileReader();
      reader.onload = function (e) {
        svgTextarea.value = e.target.result;
        convertSVG();
      };
      reader.readAsText(file);
    } else {
      alert('Please upload a valid SVG file.');
    }
  });

  function convertSVG() {
    let svg = svgTextarea.value.trim();

    if (!svg.startsWith("<svg")) {
      alert("Please provide valid SVG code.");
      return;
    }

    // Minify SVG
    let minified = svg
      .replace(/\n/g, '')
      .replace(/"/g, "'")
      .replace(/\s{2,}/g, ' ')
      .trim();

    // Base64 encode
    let base64 = `data:image/svg+xml;utf8,${encodeURIComponent(minified)}`;

    // Outputs
    base64Output.textContent = base64;
    cssOutput.textContent = `background-image: url("${base64}");`;
    simpleOutput.textContent = `background-image: url("data:image/svg+xml;utf8,${minified}");`;

    // Preview
    previewBox.style.backgroundImage = `url("${base64}")`;
  }
</script>

</body>
</html>
